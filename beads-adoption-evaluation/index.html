  if (!glossary || !glossary.length) return null;
  const div = document.createElement('div');
  div.className = 'item-glossary';
  const dl = document.createElement('dl');
  glossary.forEach(({ term, desc }) => {
    const dt = document.createElement('dt');
    dt.textContent = term;
    const dd = document.createElement('dd');
    dd.textContent = desc;
    dl.append(dt, dd);
  });
  div.appendChild(dl);
  return div;
}

function renderItem(item) {
  const div = document.createElement('div');
  div.className = 'item';
  div.dataset.id = item.id;

  const idSpan = document.createElement('span');
  idSpan.className = 'item-id';
  idSpan.textContent = item.id;

  const titleDiv = document.createElement('div');
  titleDiv.className = 'item-title';
  titleDiv.textContent = item.title;

  /* body: agent-authored HTML via createContextualFragment. <style>/<svg> apply; <script> is forbidden by agent policy (not by this mechanism). Only trusted EXPLAIN_DATA flows here — no user input. */
  const body = document.createElement('div');
  body.className = 'item-body';
  const range = document.createRange();
  range.selectNodeContents(body);
  body.appendChild(range.createContextualFragment(item.body));

  div.append(idSpan, titleDiv, body);

  const glossaryEl = renderGlossary(item.glossary);
  if (glossaryEl) div.appendChild(glossaryEl);

  return div;
}

function renderSections() {
  const container = document.getElementById('sections');
  let total = 0;
  EXPLAIN_DATA.forEach(sec => {
    const secEl = document.createElement('section');
    secEl.className = 's';
    secEl.id = sec.id;

    const h2 = document.createElement('h2');
    h2.textContent = sec.title;
    secEl.appendChild(h2);

    if (sec.summary) {
      const sumEl = document.createElement('div');
      sumEl.className = 'sec-summary';
      sumEl.textContent = sec.summary;
      secEl.appendChild(sumEl);
    }

    sec.items.forEach(item => { total++; secEl.appendChild(renderItem(item)); });
    container.appendChild(secEl);
  });
  document.getElementById('total-count').textContent = total;
}

function renderTOC() {
  const toc = document.getElementById('toc');
  EXPLAIN_DATA.forEach(sec => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + sec.id;
    a.textContent = sec.title;
    li.appendChild(a);
    toc.appendChild(li);
  });
  if (GLOSSARY && GLOSSARY.length) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#glossary';
    a.textContent = '📖 용어사전';
    li.appendChild(a);
    toc.appendChild(li);
  }
}

function renderGlossarySection() {
  if (!GLOSSARY || !GLOSSARY.length) return;
  const container = document.getElementById('sections');
  const sec = document.createElement('section');
  sec.className = 's glossary-section';
  sec.id = 'glossary';

  const h2 = document.createElement('h2');
  h2.textContent = '📖 용어사전';
  sec.appendChild(h2);

  GLOSSARY.forEach(g => {
    const entry = document.createElement('div');
    entry.className = 'glossary-entry';
    entry.id = 'g-' + g.slug;

    const term = document.createElement('div');
    term.className = 'g-term';
    term.textContent = g.term;

    /* desc: agent-authored HTML (trusted EXPLAIN_DATA sibling) — render as fragment for code/emphasis. */
    const desc = document.createElement('div');
    desc.className = 'g-desc';
    const range = document.createRange();
    range.selectNodeContents(desc);
    desc.appendChild(range.createContextualFragment(g.desc));

    const back = document.createElement('a');
    back.className = 'g-back';
    back.href = '#top';
    back.textContent = '맨 위로 ↑';

    entry.append(term, desc, back);
    sec.appendChild(entry);
  });

  container.appendChild(sec);
}

function attachEvents() {
  /* TOC highlight via IntersectionObserver */
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting)
        document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('current', a.getAttribute('href') === '#' + e.target.id));
    });
  }, { threshold: 0.2 });
  document.querySelectorAll('section.s').forEach(s => observer.observe(s));

  /* expand / collapse all <details> */
  const btn = document.getElementById('btn-toggle-all');
  let allOpen = loadToggleState();

  function applyToggle() {
    document.querySelectorAll('.item-body details').forEach(d => { d.open = allOpen; });
    btn.textContent = allOpen ? '▼ 전체 접기' : '▶ 전체 펼치기';
    saveToggleState(allOpen);
  }

  btn.addEventListener('click', () => { allOpen = !allOpen; applyToggle(); });

  /* apply saved state after render */
  applyToggle();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

document.getElementById('gen-date').textContent = new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }) + ' 생성';

renderTOC();
renderSections();
renderGlossarySection();

/* Mermaid: head CDN loaded it; render the .mermaid blocks injected by renderSections(). */
if (window.mermaid) {
  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'strict' });
  try { mermaid.run({ querySelector: '.mermaid' }); }
  catch (e) { console.error('mermaid.run failed', e); }
}
attachEvents();
</script>
</body>
</html>
