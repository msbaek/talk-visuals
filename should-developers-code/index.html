<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발자는 코딩을 해야 하나? — 그림 모음</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ground: #0B1420; --panel: #111E2E; --line: #22334A;
    --ink: #ECF4FC; --sub: #8FA3B8; --cyan: #29D6FF;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
            "Noto Sans KR", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --ground: #EEF2F7; --panel: #FFFFFF; --line: #D3DCE6; --ink: #14202E; --sub: #56697E; --cyan: #0079A8; }
  }
  :root[data-theme="light"] { --ground: #EEF2F7; --panel: #FFFFFF; --line: #D3DCE6; --ink: #14202E; --sub: #56697E; --cyan: #0079A8; }
  :root[data-theme="dark"]  { --ground: #0B1420; --panel: #111E2E; --line: #22334A; --ink: #ECF4FC; --sub: #8FA3B8; --cyan: #29D6FF; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); line-height: 1.7; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 62rem; margin: 0 auto; padding: clamp(3rem, 8vw, 6rem) 1.4rem 5rem; display: flex; flex-direction: column; gap: 2.5rem; }
  .eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cyan); margin-bottom: 0.8rem; }
  h1 { font-size: clamp(1.6rem, 4.5vw, 2.2rem); font-weight: 720; letter-spacing: -0.025em; }
  .lede { color: var(--sub); margin-top: 0.7rem; }
  .lede a { color: var(--cyan); }
  figure { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 1.2rem; }
  figure .box { overflow-x: auto; background: #fff; border-radius: 2px; }
  figure img { display: block; width: 100%; height: auto; min-width: 640px; }
  figcaption { margin-top: 0.9rem; font-size: 0.93rem; color: var(--sub); }
  figcaption b { color: var(--ink); font-weight: 650; }
  figcaption code { font-family: var(--mono); font-size: 0.85em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">brunch · @cleancode/109</p>
    <h1>개발자는 코딩을 해야 하나?</h1>
    <p class="lede">글에 쓰인 그림 세 장. 원문은 <a href="https://brunch.co.kr/@cleancode/109">brunch.co.kr/@cleancode/109</a>, 예제 코드는 <a href="https://gist.github.com/msbaek/ed44e25d69e91e6449ca37472911f9c4">gist</a>.</p>
  </header>

  <figure>
    <div class="box"><img src="programming-abstraction-evolution.png" alt="프로그래밍 추상화 수준의 변화 - 프로그래머가 작성하는 Code의 추상화가 한 단계씩 올라간다"></div>
    <figcaption><b>그림 1.</b> 프로그래밍 추상화 수준의 변화. 종이 테이프 → Assembler → Compiler → Transpiler → AI Agent. 각 단계에서 사람이 더 이상 보지 않게 된 것이 한 단계씩 올라간다.</figcaption>
  </figure>

  <figure>
    <div class="box"><img src="c-compile-pipeline-gcc.png" alt="C 컴파일 파이프라인 (gcc 기준)"></div>
    <figcaption><b>그림 2.</b> C 컴파일 파이프라인(gcc 기준). <code>.c</code> → <code>.s</code> → <code>.o</code> → 실행 파일. 그림 1의 컴파일러 단계를 확대한 것이다.</figcaption>
  </figure>

  <figure>
    <div class="box"><img src="executable-spec-distance.png" alt="실행 가능한 명세의 변환 단계 — .feature에서 JUnit test를 거쳐 production code까지"></div>
    <figcaption><b>그림 3.</b> 실행 가능한 명세의 변환 단계. 사람이 소유한 <code>.feature</code>에서 parser, 생성된 JUnit test를 거쳐 production code까지. 기댓값과 실행 사이에 단계가 여러 개 있어 숫자 하나를 고쳐 통과시키는 길이 없다.</figcaption>
  </figure>
</div>
</body>
</html>
